<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hire Me</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #050816, #0a0f1c);
    color: white;
    text-align: center;
    animation: fadeIn 1s ease-in;
}

h1 {
    margin-top: 40px;
    color: #00aaff;
}

/* CONTAINER */
.container {
    margin-top: 50px;
}

/* BUTTON STYLE */
.contact-btn {
    display: block;
    width: 250px;
    margin: 15px auto;
    padding: 15px;
    border-radius: 30px;
    text-decoration: none;
    color: white;
    font-size: 18px;
    transition: 0.3s;
}

/* DIFFERENT COLORS */
.whatsapp { background: #25D366; }
.fiverr { background: #1DBF73; }
.upwork { background: #6fda44; }
.email { background: #0072ff; }

/* HOVER */
.contact-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px white;
}

/* BACK */
a.back {
    display: inline-block;
    margin-top: 40px;
    padding: 10px 20px;
    background: #00aaff;
    border-radius: 20px;
    text-decoration: none;
    color: white;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<h1>Hire Me</h1>

<div class="container">

    <a class="contact-btn whatsapp" href="https://wa.me/YOURNUMBER" target="_blank">
        📱 Contact on WhatsApp
    </a>

    <a class="contact-btn fiverr" href="https://www.fiverr.com/YOURUSERNAME" target="_blank">
        💼 Fiverr Profile
    </a>

    <a class="contact-btn upwork" href="https://www.upwork.com/freelancers/~YOURID" target="_blank">
        🚀 Upwork Profile
    </a>

    <a class="contact-btn email" href="mailto:youremail@gmail.com">
        📧 Send Email
    </a>

</div>

<a href="index.html" class="back">⬅ Back to Home</a>

</body>
</html>
